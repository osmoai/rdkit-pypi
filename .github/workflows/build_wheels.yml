name: Build Wheels (cp311)

on:
  workflow_dispatch:
  push:
    branches: [ mikek/build-osmordred ]

jobs:
  build-wheels:
    name: Build wheels (cp311)
    runs-on: macos-14
    env:
      CIBW_BUILD: "cp311-macosx_arm64"
      CIBW_SKIP: "pp* *musllinux*"
      # macOS: bundle and rewrite @rpath
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel -w {dest_dir} -v {wheel}"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_BUILD_PARALLEL_LEVEL: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel delocate build wheel

      - name: Build wheels with cibuildwheel (cp311)
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: rdkit-wheels-cp311-macos
          path: wheelhouse/*.whl

  bcfp_and_molftp:
    name: Build bcfp & molftp wheels
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      CIBW_BUILD: "cp311-* cp312-* cp313-*"
      CIBW_SKIP: "pp* *musllinux*"
      RDKIT_WHEEL_DIR: "${{ github.workspace }}/rdkit_wheels"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download RDKit wheels from previous job
        uses: actions/download-artifact@v4
        with:
          name: rdkit-wheels-cp311-macos
          path: rdkit_wheels

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel build wheel

      # Build bcfp
      - name: Build bcfp
        env:
          RDKIT_WHEEL_DIR: ${{ env.RDKIT_WHEEL_DIR }}
        run: |
          bash tools/build_bcfp.sh
          mkdir -p wheelhouse
          cp external/bcfp/dist/*.whl wheelhouse/

      # Build molftp
      - name: Build molftp
        env:
          RDKIT_WHEEL_DIR: ${{ env.RDKIT_WHEEL_DIR }}
        run: |
          bash tools/build_molftp.sh
          cp external/molftp/dist/*.whl wheelhouse/

      - name: Upload bcfp/molftp wheels
        uses: actions/upload-artifact@v4
        with:
          name: bcfp-molftp-wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: wheelhouse/*.whl

      # Optional publish on tag
      - name: Publish to PyPI (bcfp & molftp)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          password: ${{ secrets.PYPI_API_TOKEN }}
